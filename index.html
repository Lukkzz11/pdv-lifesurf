<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LifeSurf - PDV & Confecções ERP</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Sistema Completo de Ponto de Venda, Fábrica de Confecções, Pedidos e Gestão LifeSurf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeSurf PDV" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Google Identity Services (GIS) para APIs Google Cloud Free Tier -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <!-- Registro do Service Worker PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => {
              console.log("[PWA] Service Worker registrado com sucesso no escopo:", reg.scope);
            })
            .catch((err) => {
              console.warn("[PWA] Falha ao registrar Service Worker:", err);
            });
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
